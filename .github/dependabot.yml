version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    ignore:
      # Majors with a code migration of their own; upgraded deliberately,
      # outside the weekly groups.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/jest-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
      # Moves together with the digest-pinned Playwright image in ci.yml.
      - dependency-name: "@playwright/test"
      # The 4.0.0 tag is a 2025 browser-only build that predates the 3.x line
      # and has no Node entry or server access key; 3.x is the current line.
      - dependency-name: "@cloudbase/js-sdk"
        versions: [">=4.0.0"]
      # The Mini Program builds with Taro 4, whose React renderer and Babel
      # preset support React 18, Babel 7, and react-refresh 0.14; its package
      # also keeps TypeScript 5. Newer majors compile but break the app at
      # launch (apps/wechat/test/taro-toolchain.test.ts checks the versions).
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: react-refresh
        versions: [">=0.15.0"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Taro 4's webpack runner requires webpack 5.91.0 exactly.
      - dependency-name: webpack
        versions: [">5.91.0"]
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: weekly
    # The API and web images build on the same Node base image.
    groups:
      base-images:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
