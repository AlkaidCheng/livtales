name: CI

on:
  workflow_call:
    inputs:
      retain_images:
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-static:
    name: quality-static
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version: 26
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format, lint, type-check, and build
        run: pnpm check:static

  quality-tests:
    name: quality-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: chronelle
          POSTGRES_PASSWORD: chronelle_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chronelle -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://chronelle:chronelle_dev@localhost:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version: 26
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify PostgreSQL client
        run: psql --version
      - name: Run the package suites
        run: pnpm check:tests

  quality:
    name: quality
    needs: [quality-static, quality-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both halves of the quality gate to pass
        env:
          STATIC_RESULT: ${{ needs.quality-static.result }}
          TESTS_RESULT: ${{ needs.quality-tests.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$TESTS_RESULT" = success
  containers:
    name: containers
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build API container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          push: false
          tags: livtales-api:validation
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Build web container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          push: false
          tags: livtales-web:validation
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Check runtime containers
        env:
          API_IMAGE: livtales-api:validation
          WEB_IMAGE: livtales-web:validation
          EXPECTED_REVISION: ${{ github.sha }}
        run: node infrastructure/scripts/check-containers.mjs
      - name: Save validated images
        if: inputs.retain_images
        run: docker save --output runtime-images.tar livtales-api:validation livtales-web:validation
      - name: Retain validated images
        if: inputs.retain_images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-images-${{ github.sha }}
          path: runtime-images.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  browser-tests:
    name: browser-tests
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
    strategy:
      fail-fast: false
      matrix:
        project:
          [chromium-desktop, chromium-mobile, webkit-desktop, webkit-mobile]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: chronelle
          POSTGRES_USER: chronelle
          POSTGRES_PASSWORD: chronelle_dev
        options: >-
          --health-cmd "pg_isready -U chronelle -d chronelle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://chronelle:chronelle_dev@postgres:5432/chronelle
      E2E_PROJECT: ${{ matrix.project }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version: 26
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run browser release gate
        run: pnpm test:e2e
      - name: Retain browser failure and retry diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failures-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.project }}
          path: |
            test-results/playwright/**/test-failed-*.png
            test-results/playwright/**/error-context.md
            test-results/playwright/**/trace.zip
          if-no-files-found: ignore
          retention-days: 3

  sandbox:
    name: sandbox
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version: 26
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check offline design sandbox
        run: pnpm test:sandbox
      - name: Retain sandbox failure and retry diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/sandbox/**/test-failed-*.png
            test-results/sandbox/**/error-context.md
            test-results/sandbox/**/trace.zip
          if-no-files-found: ignore
          retention-days: 3

  browser:
    name: browser
    needs: [browser-tests, sandbox]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both browser suites to pass
        env:
          BROWSER_RESULT: ${{ needs.browser-tests.result }}
          SANDBOX_RESULT: ${{ needs.sandbox.result }}
        run: |
          test "$BROWSER_RESULT" = success
          test "$SANDBOX_RESULT" = success
