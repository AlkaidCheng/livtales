name: Publish containers

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and load release images without registry publication
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      retain_images: true

  publish:
    needs: validate
    runs-on: ubuntu-latest
    env:
      PUBLISH_IMAGES: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download validated images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-images-${{ github.sha }}
      - name: Load validated images
        run: docker load --input runtime-images.tar
      - name: Verify image revisions
        run: |
          for app in api web; do
            revision="$(docker image inspect "livtales-${app}:validation" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            test "$revision" = "$GITHUB_SHA"
          done
      - name: Sign in to GitHub Container Registry
        if: env.PUBLISH_IMAGES == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - name: Publish validated images
        if: env.PUBLISH_IMAGES == 'true'
        run: |
          for app in api web; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}-${app}"
            source="livtales-${app}:validation"
            docker tag "$source" "${image}:sha-${GITHUB_SHA}"
            docker push "${image}:sha-${GITHUB_SHA}"
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              docker tag "$source" "${image}:${GITHUB_REF_NAME}"
              docker push "${image}:${GITHUB_REF_NAME}"
            fi
          done
